name: BlockPuzzle
options:
  bundleIdPrefix: com.emre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GameCore:
    path: GameCore

targets:
  BlockPuzzle:
    type: application
    platform: iOS
    sources:
      - BlockPuzzle
    dependencies:
      - package: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emre.blockpuzzle
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Block Puzzle"
        CODE_SIGN_STYLE: Automatic
        # Game Center: ücretli Apple Developer hesabı gerektirir.
        # Ücretsiz provizyonla cihaza kurmak istersen bu satırı geçici olarak kaldır.
        CODE_SIGN_ENTITLEMENTS: BlockPuzzle/BlockPuzzle.entitlements
